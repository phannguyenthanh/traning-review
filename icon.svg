<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- Glowing aura -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)"/>
  <!-- Card Back Outline -->
  <rect x="110" y="90" width="292" height="332" rx="28" fill="#1e293b" stroke="#475569" stroke-width="5" transform="rotate(-6 256 256)"/>
  <!-- Card Front -->
  <rect x="110" y="90" width="292" height="332" rx="28" fill="#0f172a" stroke="url(#cardGrad)" stroke-width="6" transform="rotate(4 256 256)"/>
  <!-- Code Icon & Flashcard content -->
  <path d="M 195 210 L 150 256 L 195 302" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 317 210 L 362 256 L 317 302" fill="none" stroke="#6366f1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 275 190 L 235 322" fill="none" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <!-- Sound wave symbol -->
  <path d="M 230 370 A 20 20 0 0 1 282 370" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
